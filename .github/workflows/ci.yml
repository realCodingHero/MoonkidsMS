name: CI Build and Test

on:
  push:
    branches:
      - master
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend Maven Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        run: mvn test --batch-mode

      - name: Build BeiDou.jar
        run: mvn package -DskipTests --batch-mode

      - name: Upload Backend Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BeiDou-Server-jar
          path: gms-server/target/BeiDou.jar
          retention-days: 7

  frontend-build:
    name: Frontend Vue UI Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: 'gms-ui/yarn.lock'

      - name: Install Dependencies
        working-directory: gms-ui
        run: yarn install --frozen-lockfile

      - name: Build Frontend
        working-directory: gms-ui
        run: yarn build

      - name: Upload Frontend Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: beidou-ui-dist
          path: gms-ui/dist/
          retention-days: 7
